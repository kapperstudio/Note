const $=(s,r=document)=>r.querySelector(s);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I=(n,c='ic')=>`<svg class="${c}"><use href="#i-${n}"/></svg>`;
const isMediaURL=s=>!s||s.startsWith('data:')||s.startsWith('http')||s.startsWith('blob:');
const PIC=s=>isMediaURL(s)?(s||''):`https://picsum.photos/seed/${s}/700/875`;
const SQR=s=>isMediaURL(s)?(s||''):`https://picsum.photos/seed/${s}/400/400`;
const rp=n=>'Rp '+(+n||0).toLocaleString('id-ID');
const fmt=n=>n>=1000?(Math.round(n/100)/10+'').replace(/\.0$/,'')+'K':String(n);
const DAY=86400e3,HOUR=3600e3;

function linkify(s){
  let out=esc(s),urls=[];
  out=out.replace(/(https?:\/\/[^\s<]+)/g,m=>{urls.push(m);return '\u0001'+(urls.length-1)+'\u0001'});
  out=out.replace(/#([\w-]+)/g,(m,t)=>`<span class="tag cursor" data-go="hashtag/${t.toLowerCase()}">#${t}</span>`);
  out=out.replace(/@([\w.]+)/g,(m,u)=>{
    if(u.toLowerCase()===(state.me.username||'').toLowerCase())return `<span class="tag cursor" data-go="profile">@${u}</span>`;
    const k=Object.keys(USERS).find(x=>x.toLowerCase()===u.toLowerCase());
    return k?`<span class="tag cursor" data-go="barber/${k}">@${u}</span>`:m;});
  out=out.replace(/\u0001(\d+)\u0001/g,(m,i)=>`<a class="tag" href="${esc(urls[+i])}" target="_blank" rel="noopener">${esc(hostOf(urls[+i]))}</a>`);
  return out;
}
function linkifyMsg(s){
  let out=esc(s),urls=[];
  out=out.replace(/(https?:\/\/[^\s<]+)/g,m=>{urls.push(m);return '\u0001'+(urls.length-1)+'\u0001'});
  out=out.replace(/#([\w-]+)/g,(m,t)=>`<span class="tag cursor" data-go="hashtag/${t.toLowerCase()}">#${t}</span>`);
  out=out.replace(/@([\w.]+)/g,(m,u)=>{
    if(u.toLowerCase()===(state.me.username||'').toLowerCase())return `<span class="tag cursor" data-go="profile">@${u}</span>`;
    const k=Object.keys(USERS).find(x=>x.toLowerCase()===u.toLowerCase());
    return k?`<span class="tag cursor" data-go="barber/${k}">@${u}</span>`:m;});
  out=out.replace(/\u0001(\d+)\u0001/g,(m,i)=>{const u=urls[+i],h=hostOf(u);
    if(h.includes('barbergo.app')){const path=u.split('barbergo.app/')[1]||'home';return `<span class="tag cursor" data-go="${esc(path)}">${esc(u)}</span>`}
    return `<a class="tag" href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`;});
  return out;
}

  if(!/^[a-z0-9._]{3,20}$/.test(u))return '3-20 karakter: huruf kecil, angka, titik, underscore';

}

function fbErrorInfo(e,where){
  const code=String((e&&e.code)||'unknown');
  const message=String((e&&e.message)||e||'Unknown error');
  const info={where,code,message,uid:FBuid||null,time:new Date().toISOString()};
  console.error('[BarberGo][Firebase]',info,e);
  return info;
}
function isUnavailable(e){
  const c=String((e&&e.code)||'').toLowerCase();
  const m=String((e&&e.message)||'').toLowerCase();
  return c==='unavailable'||c==='network-request-failed'||(c==='failed-precondition'&&/offline|network/.test(m));
}
function isPermissionError(e){
  const c=String((e&&e.code)||'').toLowerCase();
  return c==='permission-denied'||c==='unauthenticated';
}
function retryDelay(attempt){
  return Math.min(30000,1000*Math.pow(2,Math.min(attempt,5)))+Math.floor(Math.random()*400);
}
function scheduleSync(delay){
  clearTimeout(syncRetryT);
  syncRetryT=setTimeout(()=>{syncRetryT=null;syncCloud()},Math.max(0,delay||0));
}

async function getCloudDocWithRetry(ref,maxAttempts=6){
  let lastErr=null;
  for(let attempt=0;attempt<maxAttempts;attempt++){
    try{
      const snap=await BGF.getDoc(ref);
      console.info('[BarberGo][Firebase] Firestore getDoc OK',{uid:FBuid,attempt:attempt+1,exists:snap.exists()});
      return snap;
    }catch(e){
      lastErr=e;
      fbErrorInfo(e,'getDoc/users/'+FBuid);
      if(!isUnavailable(e))throw e;
      if(attempt<maxAttempts-1){
        const delay=retryDelay(attempt);
        console.warn('[BarberGo][Firebase] getDoc unavailable, retry '+(attempt+1)+'/'+maxAttempts+' in '+delay+'ms');
        await new Promise(r=>setTimeout(r,delay));
      }
    }
  }
  throw lastErr;
}

function rememberAuthor(p){

  const a=p.author||{};

  else Object.assign(USERS[p.u],a);
}
function normalizeCloudPost(p){

  s.created=Number(s.created||0);

async function syncCloud(){
  if(!window.BGF||!FBuid||!syncPending||syncBusy)return;
  syncBusy=true;
  const gen=syncGeneration;
  const ref=BGF.doc(BGF.db,'users',FBuid);
  try{
    let lastErr=null;
    for(let attempt=0;attempt<6;attempt++){
      try{
        await BGF.setDoc(ref,cloudPayload(),{merge:true});
        if(gen===syncGeneration){syncPending=false;syncRetry=0;}
        console.info('[BarberGo][Firebase] Firestore setDoc OK',{uid:FBuid,attempt:attempt+1});
        lastErr=null;
        break;
      }catch(e){
        lastErr=e;
        fbErrorInfo(e,'setDoc/users/'+FBuid);
        if(!isUnavailable(e))break;
        if(attempt<5){
          const delay=retryDelay(attempt);
          console.warn('[BarberGo][Firebase] setDoc unavailable, retry '+(attempt+1)+'/6 in '+delay+'ms');
          await new Promise(r=>setTimeout(r,delay));
        }
      }
    }
    if(!lastErr && gen===syncGeneration){
      for(const post of (state.posts||[]).filter(p=>p.u==='me')){
        if(post._pendingCloud!==false){
          const ok=await publishPostCloud(post);
          if(!ok)break;
        }
      }
    }
    if(lastErr){
      if(isPermissionError(lastErr)){
        syncPending=false;
        console.error('[BarberGo][Firebase] Firestore menolak write. Periksa Authentication dan Security Rules.');
      }else{
        syncRetry=Math.min(syncRetry+1,5);
        scheduleSync(retryDelay(syncRetry));
        console.error('[BarberGo][Firebase] setDoc gagal setelah retry. Data tetap tersimpan di LocalStorage dan akan dicoba lagi.',lastErr);
      }
    }
  }finally{
    syncBusy=false;
  }
}

const CLOUDINARY={cloud:'o9nnrrra',preset:'Barbergo'};
async function cloudUpload(file){
  const isVid=file.type&&file.type.startsWith('video');
  const fd=new FormData();
  fd.append('file',file);
  fd.append('upload_preset',CLOUDINARY.preset);
  const res=await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY.cloud+'/'+(isVid?'video':'image')+'/upload',{method:'POST',body:fd});
  const data=await res.json();
  if(!res.ok||!data.secure_url)throw new Error((data&&data.error&&data.error.message)||'Upload Cloudinary gagal');

  if(c.includes('email-already-in-use'))return'Email sudah terdaftar. Silakan masuk';
  if(c.includes('weak-password'))return'Password minimal 6 karakter';
  if(c.includes('invalid-email'))return'Format email tidak valid';
  if(c.includes('too-many-requests'))return'Terlalu banyak percobaan. Coba lagi nanti';
  if(c.includes('popup-closed')||c.includes('cancelled-popup'))return'Login dibatalkan';
  if(c.includes('popup-blocked'))return'Popup diblokir. Izinkan popup lalu ulangi';
  if(c.includes('redirect-cancelled-by-user'))return'Login Google dibatalkan';
  if(c.includes('account-exists-with-different-credential'))return'Akun sudah terdaftar dengan metode login lain';
  if(c.includes('operation-not-allowed')||c.includes('configuration-not-found'))return'Metode login belum aktif di Firebase Console';
  if(c.includes('unauthorized-domain'))return'Domain belum diizinkan di Firebase → Authentication → Settings';
  if(c.includes('network'))return'Koneksi internet bermasalah';

  if(c.includes('failed-precondition'))return'Firestore belum siap. Periksa konfigurasi Firebase';
  if(c.includes('permission-denied'))return'Akses Firestore ditolak. Periksa Security Rules';
  return'Gagal: '+((e&&e.message)||e);
}

function rankedFeed(mode){
  const now=Date.now(), me=FBuid||'me';
  const followed=new Set(Object.keys(state.follows||{}).filter(k=>state.follows[k]));
  const seen=new Set(Object.keys(state.likes||{}));
  const interests=new Set();
  (state.posts||[]).filter(p=>p.u==='me'||followed.has(p.u)).forEach(p=>{
    String(p.tags||'').toLowerCase().split(/\s+/).filter(Boolean).forEach(t=>interests.add(t));
  });
  let arr=(state.posts||[]).filter(p=>p&&p.id&&p.created);
  arr=arr.map(p=>{
    const ageH=Math.max(.05,(now-(p.created||now))/HOUR);
    const fresh=Math.max(0,42-ageH*2.1);
    const engagement=Math.log1p(Math.max(0,p.likes||0))*5 + Math.log1p((p.cm||0)+countC(p.comments))*3;
    const followScore=(p.u==='me'||followed.has(p.u))?32:0;
    const tagScore=String(p.tags||'').toLowerCase().split(/\s+/).reduce((n,t)=>n+(interests.has(t)?4:0),0);
    const mediaScore=p.vid?2:1;
    const repeatPenalty=seen.has(p.id)?-2:0;
    const deterministic=(hashS(p.id+String(state.seed||1))%17)/10;
    return {p,s:fresh+engagement+followScore+tagScore+mediaScore+repeatPenalty+deterministic};
  });
  if(mode==='m') arr=arr.filter(x=>x.p.u==='me'||followed.has(x.p.u));
  if(mode==='t'&&state.gps) arr.sort((a,b)=>distU(a.p.u)-distU(b.p.u));
  else arr.sort((a,b)=>b.s-a.s);
  // Diversifikasi ala feed sosial: jangan menumpuk banyak post dari author yang sama.
  const out=[],rest=[...arr],counts=new Map();
  while(rest.length){
    let pick=rest.findIndex(x=>(counts.get(x.p.u)||0)<2);
    if(pick<0)pick=0;
    const x=rest.splice(pick,1)[0];out.push(x.p);counts.set(x.p.u,(counts.get(x.p.u)||0)+1);
  }
  return out;
}
function rankedExplore(){
  const now=Date.now(), followed=new Set(Object.keys(state.follows||{}).filter(k=>state.follows[k]));
  const tags=new Set();
  (state.posts||[]).filter(p=>followed.has(p.u)).forEach(p=>String(p.tags||'').toLowerCase().split(/\s+/).filter(Boolean).forEach(t=>tags.add(t)));
  const scored=(state.posts||[]).filter(p=>p&&p.id).map(p=>{
    const ageH=Math.max(.05,(now-(p.created||now))/HOUR);
    const fresh=Math.max(0,28-ageH*1.2);
    const eng=Math.log1p(p.likes||0)*7+Math.log1p((p.cm||0)+countC(p.comments))*5;
    const affinity=String(p.tags||'').toLowerCase().split(/\s+/).reduce((n,t)=>n+(tags.has(t)?5:0),0);
    const followPenalty=followed.has(p.u)?-1:4;
    const diversity=(hashS(p.id+'explore')%23)/10;
    return {p,s:fresh+eng+affinity+followPenalty+diversity};
  }).sort((a,b)=>b.s-a.s);
  const out=[],counts=new Map(),rest=[...scored];
  while(rest.length){
    let pick=rest.findIndex(x=>(counts.get(x.p.u)||0)<3);if(pick<0)pick=0;
    const x=rest.splice(pick,1)[0];out.push(x.p);counts.set(x.p.u,(counts.get(x.p.u)||0)+1);
  }
  return out;
}

function initLeafMap(el,{pins=[],pick=false,onPick=null,me=false,center=null,zoom=11}){
  if(!window.L){
    el.innerHTML=`<div class="mapwrap" style="position:absolute;inset:0"><div class="mapinner">${MAPBG}
      ${me?`<span class="mpin me" style="left:63%;top:64%">${I('user')}</span>`:''}
      ${pins.map(p=>`<button class="mpin t-${p.type}" style="left:${p.x}%;top:${p.y}%" data-pin="${p.id}">${I(p.ic==='bag'?'bag':p.ic==='scissors'?'scissors':p.ic==='star'?'star':'pin')}</button>`).join('')}</div></div>`;
    return {fallback:true};
  }
  const map=L.map(el,{zoomControl:false,attributionControl:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  map.setView(center||xy2ll(60,66),zoom);
  let pickM=null;
  if(pick){
    map.on('click',e=>{
      if(pickM)map.removeLayer(pickM);
      pickM=L.marker(e.latlng,{icon:mkIcon('pick')}).addTo(map);
      onPick&&onPick({lat:e.latlng.lat,lng:e.latlng.lng});
    });
  }else{
    pins.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:mkIcon(p.type,p.ic)}).addTo(map);m.on('click',()=>onPick&&onPick(p))});
  }
  return {map,
    addPin:p=>{const m=L.marker([p.lat,p.lng],{icon:mkIcon(p.type,p.ic)}).addTo(map);m.on('click',()=>onPick&&onPick(p));return m},
    flyTo:(lat,lng,z=13)=>map.flyTo([lat,lng],z,{duration:.7}),
    setPickMarker:(lat,lng)=>{if(pickM)map.removeLayer(pickM);pickM=L.marker([lat,lng],{icon:mkIcon('pick')}).addTo(map);map.flyTo([lat,lng],13,{duration:.6})}
  };
}
function nearestCity(lat,lng){
  const [x,y]=ll2xy(lat,lng);let best=CITIES[0],bd=1e9;
  CITIES.forEach(c=>{const d=(c.x-x)**2+(c.y-y)**2;if(d<bd){bd=d;best=c}});
  return best.n+(bd>9?' - Sekitar':'');
}

let feedBatch=4;
function homeRecommendations(){
  const followed=new Set(Object.keys(state.follows||{}).filter(k=>state.follows[k]));
  const pool=Object.entries(USERS).filter(([uid,u])=>uid!=='me'&&uid!==FBuid&&u&&u.username&&!followed.has(uid));
  if(pool.length<2)return '';
  const scored=pool.map(([uid,u])=>({uid,u,s:((FOLLOW_META[uid]?.followers||u.followers||[]).length*3)+(hashS(uid+String(state.seed||1))%37)})).sort((a,b)=>b.s-a.s);
  const picks=scored.slice(0,5);
  return `<section class="home-reco"><div class="home-reco-head"><b>Rekomendasi untuk kamu</b><span>Temukan barber baru</span></div><div class="home-reco-scroll">${picks.map(({uid,u})=>`<div class="home-reco-card">${av(uid,58,`class="avatar sz58 cursor" data-go="barber/${uid}"`)}<b data-go="barber/${uid}">${esc(u.username)}${vb(uid)}</b><small>${esc(u.cat||'Barber')}</small>${followButton(uid,true)}</div>`).join('')}</div></section>`;
}
function shouldShowHomeReco(index){
  if(index<2)return false;
  const seed=String(state.seed||1);
  const slot=Math.floor(index/2);
  return hashS(seed+'reco-'+slot)%7===0 || (index===3 && hashS(seed+'reco-main')%3===0);
}
function feedHTML(){
  const arr=rankedFeed(feedMode);

}

function bootMapsScreen(){
  const el=$('#lmap');if(!el)return;
  const pins=allPins();
  mapsAPI=initLeafMap(el,{pins,onPick:p=>placeSheet(p),center:xy2ll(60,66),zoom:10});
  const inp=$('#mapSearch'),box=$('#mapAC');
  if(!inp)return;
  inp.addEventListener('input',()=>{
    const q=inp.value.trim().toLowerCase();
    if(!q){box.hidden=true;box.innerHTML='';return}
    let html='';
    CITIES.filter(c=>c.n.toLowerCase().includes(q)).slice(0,4).forEach(c=>{const[lat,lng]=cityLL(c.n);
      html+=`<button class="ac-row" data-mapcity="${esc(c.n)}" data-lat="${lat}" data-lng="${lng}">${I('pin','ic ic16')}<span>${esc(c.n)}</span><span class="sub">Kota</span></button>`});
    Object.entries(USERS).filter(([k,u])=>u.stats&&(uname(k).toLowerCase().includes(q)||u.loc.toLowerCase().includes(q))).slice(0,4).forEach(([k])=>{const p=pins.find(x=>x.id==='b:'+k);
      if(p)html+=`<button class="ac-row" data-mappin="${p.id}">${av(k,30)}<span>${uname(k)}${vb(k)}</span><span class="sub">${esc(p.loc)}</span></button>`});
    state.products.filter(p=>p.n.toLowerCase().includes(q)).slice(0,3).forEach(p=>{const ps=pins.find(x=>x.type==='product'&&x.name===p.n);
      if(ps)html+=`<button class="ac-row" data-mappin="${ps.id}"><span class="tagic">${I('bag','ic ic16')}</span><span>${esc(p.n)}</span><span class="sub">${rp(p.p)}</span></button>`});
    box.innerHTML=html;box.hidden=!html;
    clearTimeout(window.__bgMapSearchT);
    window.__bgMapSearchT=setTimeout(async()=>{
      try{
        const res=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&accept-language=id&limit=5&q='+encodeURIComponent(inp.value.trim()),{headers:{'Accept':'application/json'}});
        const places=await res.json();
        const remote=(places||[]).map(p=>`<button class="ac-row" data-mapremote="1" data-lat="${esc(p.lat)}" data-lng="${esc(p.lon)}" data-label="${esc(p.display_name||p.name||'Lokasi')}">${I('pin','ic ic16')}<span><b>${esc(p.name||p.display_name||'Lokasi')}</b><small class="sub" style="display:block;margin-left:0">${esc(p.display_name||'')}</small></span></button>`).join('');
        if(remote){box.insertAdjacentHTML('beforeend',remote);box.hidden=false;}
      }catch(e){}
    },320);
  });
  const gps=$('#gpsBtn');
  if(gps)gps.onclick=()=>askGPS(()=>{if(state.gps&&mapsAPI&&mapsAPI.flyTo)mapsAPI.flyTo(state.gps.lat,state.gps.lng,13)});
}
function videoThumb(url,fallback=''){
  const u=String(url||'');
  if(/res\.cloudinary\.com\//i.test(u)){
    const i=u.indexOf('/video/upload/');
    if(i>=0){
      const tail=u.slice(i+'/video/upload/'.length);
      const dot=tail.lastIndexOf('.');
      return u.slice(0,i)+'/video/upload/so_0/'+tail.slice(0,dot)+'.jpg';
    }
  }
  return fallback?PIC(fallback):'';
}

function reconcileTransactions(){
  let changed=false;
  (state.txs||[]).forEach(tx=>{
    if(tx.status==='Selesai'&&!tx.applied){
      if(tx.type==='topup')state.balance+=(+tx.amount||0);
      if(tx.type==='withdraw')state.balance=Math.max(0,state.balance-(+tx.amount||0));
      tx.applied=true;changed=true;
    }
  });
  if(changed)save();
}

function wireFeed(){
  if(feedIO){feedIO.disconnect();feedIO=null}
  $$('.feed-video').forEach(v=>{const src=v.dataset.feedvid;if(src&&!v.src)v.src=src;v.muted=!!state.muted});
  $$('.feed-audio').forEach(a=>{const src=a.dataset.feedaudio;if(src&&!a.src)a.src=src;a.muted=!!state.muted});
  const mediaEls=$$('.feed-media');
  const playMedia=el=>{
    const v=el.querySelector('video');
    const a=el.querySelector('.feed-audio');
    if(v)v.play().catch(()=>{});
    if(a){a.muted=!!state.muted;a.play().catch(()=>{});}
  };
  const pauseMedia=el=>{const v=el.querySelector('video');const a=el.querySelector('.feed-audio');if(v)v.pause();if(a)a.pause()};
  if('IntersectionObserver' in window){
    const vio=new IntersectionObserver(es=>es.forEach(en=>{if(en.intersectionRatio>0.65)playMedia(en.target);else pauseMedia(en.target)}),{root:view,threshold:[0,.65]});
    mediaEls.forEach(el=>vio.observe(el));
  }else mediaEls.forEach(playMedia);
  const s=$('#feedSent');if(!s||!('IntersectionObserver' in window))return;
  feedIO=new IntersectionObserver(es=>{
    if(es[0].isIntersecting){feedBatch+=4;const f=$('.feed');if(f){f.innerHTML=feedHTML();wireFade();wireFeed()}}
  },{root:view,rootMargin:'500px'});
  feedIO.observe(s);
}

function openViewer(slides,u,label){

  state.seen[u]=1;save();
  $$(`[data-story="${u}"] .ring`).forEach(r2=>r2.classList.add('seen'));

  o.innerHTML=`<img class="sv-img" src="${PIC(slides[0])}" alt="">

    <button class="sv-zone l" data-dir="-1"></button><button class="sv-zone r" data-dir="1"></button>`;
  shellEl.appendChild(o);
  const bars=$$('.sv-bars b',o),img=$('.sv-img',o);let idx=0,paused=false,remaining=4200,startedAt=Date.now();
  const clearTimer=()=>{clearTimeout(storyTimer);storyTimer=null};
  const schedule=()=>{clearTimer();startedAt=Date.now();storyTimer=setTimeout(()=>show(idx+1),remaining)};
  const pause=()=>{if(paused)return;paused=true;remaining=Math.max(0,remaining-(Date.now()-startedAt));clearTimer();o.classList.add('paused')};
  const resume=()=>{if(!paused)return;paused=false;o.classList.remove('paused');schedule()};
  const close=()=>{clearTimer();o.remove()};
  const show=i=>{
    if(i>=slides.length)return close();
    if(i<0)i=0;idx=i;img.src=PIC(slides[i]);
    bars.forEach((b,j)=>b.className=j<i?'done':(j===i?'run':''));
    remaining=4200;schedule();
  };
  o.addEventListener('pointerdown',e=>{if(e.target.closest('#svX'))return;pause()});
  o.addEventListener('pointerup',e=>{if(e.target.closest('#svX'))return;resume()});
  o.addEventListener('pointercancel',resume);

  show(0);
}

function qrSVG(seed){
  let h=seed%99991;const rnd=()=>{h=(h*9301+49297)%233280;return h/233280};
  let r='';
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){if((x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13))continue;if(rnd()>.52)r+=`<rect x="${x*4}" y="${y*4}" width="3.6" height="3.6"/>`}
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="22" height="22" fill="none" stroke="#000" stroke-width="4"/><rect x="${x+7}" y="${y+7}" width="8" height="8" fill="#000"/>`;
  return `<svg viewBox="0 0 88 88" fill="#000">${r}${fin(2,2)}${fin(64,2)}${fin(2,64)}</svg>`;
}

/* ============ REELS ENGINE (lazy video) ============ */
function setupReels(){
  const track=$('#reelTrack');if(!track)return;
  reelIO=new IntersectionObserver(es=>{es.forEach(en=>{
    const r=en.target,v=r.querySelector('video');
    if(en.intersectionRatio>0.6){
      if(v){if(!v.src&&v.dataset.src)v.src=v.dataset.src;v.muted=state.muted;v.play().catch(()=>{})}
      r.classList.add('playing');r.classList.remove('paused');
    }else{
      if(v)v.pause();
      r.classList.remove('playing');r.classList.add('paused');
    }
  })},{root:track,threshold:[0,.6]});
  $$('.reel').forEach(r=>reelIO.observe(r));
  $$('.reel').forEach(reel=>{
    const media=reel.querySelector('.reel-media');
    const v=reel.querySelector('video');
    let last=0,timer=null,hold=null,held=false;
    media.addEventListener('pointerdown',()=>{held=false;hold=setTimeout(()=>{held=true;if(v)v.pause();reel.classList.add('paused');vibrate(20)},300)});
    const release=()=>{
      clearTimeout(hold);
      if(held){if(v&&!reel.classList.contains('paused'))v.play().catch(()=>{});reel.classList.remove('paused');return}
      const n=Date.now();
      if(n-last<300){
        clearTimeout(timer);last=0;reel.classList.remove('paused');
        const burst=document.createElement('span');burst.className='burst';burst.innerHTML=I('heart');
        reel.appendChild(burst);setTimeout(()=>burst.remove(),700);
        const l=reel.querySelector('[data-like]');
        if(l&&!state.likes[l.dataset.like]){l.click();vibrate(25)}
        return;
      }
      last=n;
      timer=setTimeout(()=>{
        if(reel.classList.contains('paused')){reel.classList.remove('paused');if(v)v.play().catch(()=>{})}
        else{reel.classList.add('paused');if(v)v.pause()}
      },260);
    };
    media.addEventListener('pointerup',release);
    media.addEventListener('pointerleave',()=>clearTimeout(hold));
  });
}

/* ===== FILE INPUTS → Cloudinary ===== */
document.addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];
  /* Buat Post → Cloudinary */
  if(e.target.id==='createFile'&&e.target.files&&e.target.files.length){
    const files=[...e.target.files].filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/')).slice(0,10);
    if(!files.length)return;
    window.__createMediaFiles=files;
    const hint=$('#uHint'),prev=$('#uPrev');
    const hasVideo=files.some(f=>f.type.startsWith('video/'));
    if(files.length===1&&!hasVideo&&prev){prev.src=URL.createObjectURL(files[0]);prev.hidden=false;hint.style.display='';hint.innerHTML='<span>1 foto siap diposting</span>'}
    else if(hint){prev&&(prev.hidden=true);hint.style.display='';hint.innerHTML='<span>'+files.length+' media siap diposting</span><small>Urutan mengikuti pilihan file</small>'}
    snd('confirm');vibrate(15);
  }
  /* Story → Cloudinary */
  if(e.target.id==='stFile'&&file){
    const hint=$('#stHint'),prev=$('#stPrev');
    prev.hidden=true;hint.style.display='';hint.innerHTML='<span class="spin"></span> Mengunggah...';
    try{stImg=await cloudUpload(file);prev.src=stImg;prev.hidden=false;hint.style.display='none';snd('confirm')}
    catch(err){hint.innerHTML=I('image','ic ic34 dim')+'<span>Pilih foto untuk story</span>';snd('cancel')}
  }
  /* Avatar → diupload saat Simpan */
  if(e.target.id==='pfAvIn'&&file){
    pendingAv=file;
    const r=new FileReader();r.onload=()=>{$('#pfAvImg').src=r.result};r.readAsDataURL(file);
  }
  /* Media chat → Cloudinary */
  if(e.target.id==='chFile'&&file){
    const isVid=file.type.startsWith('video');
    toast('Mengunggah media...');
    try{
      const url=await cloudUpload(file);
      const th=state.chats[chatUser]||(state.chats[chatUser]=[]);
      const msg={k:'me',t:''};
      if(isVid)msg.video=url;else msg.img=url;
      if(chatReplyCtx){msg.q=chatReplyCtx;chatReplyCtx=null;$('#chReplyChip').hidden=true}
      msg.created=Date.now();th.push(msg);saveLocalOnly();
      try{await sendChatRemote(chatUser,msg)}catch(err){th.pop();saveLocalOnly();throw err}
      const cb=$('#chatBox');const rc=cb.querySelector('.receipt');if(rc)rc.remove();
      cb.insertAdjacentHTML('beforeend',bubHTML(msg,th.length-1));cb.scrollTop=cb.scrollHeight;
      snd('chatsend');
    }catch(err){toast('Upload media gagal');snd('cancel')}
  }
});

async function sendChat(){

  const th=state.chats[chatUser]||(state.chats[chatUser]=[]);th.push(msg);saveLocalOnly();

async function publish(){
  const cap=$('#capTa')?$('#capTa').value.trim():'';
  const files=window.__createMediaFiles||[];
  if(!FBuid){toast('Akun belum terhubung ke Firestore');return}
  if(!files.length&&!createImg&&!createVid){toast('Pilih minimal 1 foto atau video');return}
  if(files.length>10){toast('Maksimal 10 media per postingan');return}
  try{
    let slides=[];let vid=null;let firstImg=createImg||null;
    if(files.length){
      toast('Mengunggah '+files.length+' media...');
      for(const f of files){const url=await cloudUpload(f);if(f.type.startsWith('video')){if(!vid)vid=url}else{slides.push(url);if(!firstImg)firstImg=url}}
    }else if(createImg)slides=[createImg];
    const id='p'+Date.now();
    const post={id,u:'me',ownerUid:FBuid,img:firstImg||vid||'',vid,slides:slides.length?slides:undefined,likes:0,cm:0,cap:cap||'',tags:(cap.match(/#[\w-]+/g)||[]).join(' '),comments:[],time:postDateTime(Date.now()),loc:postLoc||'',created:Date.now(),music:state.music?{...state.music}:null,author:authorSnapshot(),_pendingCloud:true};
    state.posts.unshift(post);rememberAuthor(post);saveLocalOnly();await publishPostCloud(post);await savePostStatsRemote(post.id,{likes:0,comments:0});
    window.__createMediaFiles=[];createImg=null;createVid=null;postLoc=null;state.music=null;snd('upload');vibrate(20);go('home');toast('Postingan berhasil dibagikan ke Firestore');
  }catch(err){snd('cancel');toast('Posting gagal: '+fbErr(err))}
}

  if(story.cap.length>500){toast('Caption story maksimal 500 karakter');return}
  try{
    await publishStoryCloud(story);
    state.stories.unshift(story);saveLocalOnly();stImg=null;snd('upload');go('home');toast('Story dibagikan - tersimpan di Firestore');
  }catch(e){snd('cancel');toast('Story gagal disimpan: '+fbErr(e))}
}
async function saveProfile(){
  const m=state.me;
  const nu=$('#pfUser').value.trim().toLowerCase();
  if(nu&&(nu!==m.username)){
    const err=validUser(nu);
    if(err){snd('cancel');toast(err);return}
    m.username=nu;
  }
  m.name=$('#pfName').value.trim()||m.name;
  m.cat=$('#pfCat').value.trim()||m.cat;
  m.bio=$('#pfBio').value;
  m.link=$('#pfLink').value.trim();
  const bk=$('#pfBook');if(bk)m.bookLink=bk.value.trim();
  if(pendingAv){
    if(typeof pendingAv==='string'){m.av=pendingAv}
    else{toast('Mengunggah foto profil...');try{m.av=await cloudUpload(pendingAv)}catch(err){toast('Upload avatar gagal')}}
    pendingAv=null;
  }
  if(window.BGF&&BGF.auth&&BGF.auth.currentUser){
    try{await BGF.profile(BGF.auth.currentUser,{displayName:m.name||undefined,photoURL:(typeof m.av==='string'&&m.av.startsWith('http'))?m.av:undefined})}catch(e){}
  }
  const a=authorSnapshot();
  state.posts.filter(p=>p.u==='me'||p.ownerUid===FBuid).forEach(p=>{p.author=JSON.parse(JSON.stringify(a));p.u='me';rememberAuthor(p);if(FBuid&&window.BGF){publishPostCloud(p)}});
  save();publishPublicProfile();snd('edit');go('profile');toast('Profil diperbarui & tersinkron');
}

render();
</script>
